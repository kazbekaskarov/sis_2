name: Playwright Tests

on:
  push: # every push to every branch
  pull_request: # every pull request
  workflow_dispatch: # manual runs, used for the timing measurements

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4

      # The public site shows a Cloudflare bot check to GitHub-hosted runners,
      # so each shard tests its own copy of the Toolshop app (see toolshop/).
      - name: Start Toolshop app
        if: ${{ !vars.BASE_URL }}
        run: docker compose -f toolshop/docker-compose.yml up -d

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # caches ~/.npm, keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed database and wait for Toolshop
        if: ${{ !vars.BASE_URL }}
        run: |
          for i in $(seq 1 30); do
            docker compose -f toolshop/docker-compose.yml exec -T laravel-api \
              php artisan migrate:fresh --seed --force && break
            echo "database not ready yet ($i/30)"; sleep 5
          done
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors -o /dev/null http://localhost:8091/products
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors -o /dev/null http://localhost:4200

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost:4200' }}

      - name: Toolshop logs on failure
        if: ${{ failure() && !vars.BASE_URL }}
        run: docker compose -f toolshop/docker-compose.yml logs --tail 200

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1 # intermediate file, only needed by merge-reports

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
